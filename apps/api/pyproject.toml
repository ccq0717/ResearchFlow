[project]
name = "researchflow-api"
version = "0.1.0"
description = "FastAPI backend for ResearchFlow"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.116.0",
    "httpx>=0.28.0",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.10.0",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchflow"]

[tool.fastapi]
entrypoint = "researchflow.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
