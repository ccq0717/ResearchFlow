name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · Python 3.12 · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-packages --all-groups
      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest apps/api/tests
      - name: Run Ruff
        run: |
          .\.venv\Scripts\ruff.exe check apps/api scripts
          .\.venv\Scripts\ruff.exe format --check apps/api scripts

  frontend:
    name: Frontend · Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix apps/web --ignore-scripts
      - name: Run tests
        run: npm test --prefix apps/web
      - name: Run ESLint
        run: npm run lint --prefix apps/web
      - name: Build production bundle
        run: npm run build --prefix apps/web
